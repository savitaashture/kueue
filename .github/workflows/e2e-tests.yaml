# GitHub Actions workflow to run e2e tests using hack/e2e-test.sh
name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bash wget

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Set up kind
        uses: helm/kind-action@v1.9.0

      - name: Build binaries
        run: make build

      - name: Run e2e tests
        run: hack/e2e-test.sh
